<h1>Players</h1>
{% if player_list %}

<table>
    <thead>
        <tr>
            <th scope="col">Player</th>
        </tr>
    </thead>
    <tbody>
        {% for player in player_list %}
            <tr>
                <td><a href="{% url "mk-tracker:player-setup" player.player_id %}">{{ player.name }}</a></td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
No players saved
{% endif %}
<button onclick="location.href='{% url "mk-tracker:new-player" %}'">New Player</button><br>
<button onclick="location.href='{% url "mk-tracker:index" %}'">Main Menu</button>
